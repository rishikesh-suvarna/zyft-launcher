name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check scripts
        run: shellcheck -x -e SC1091 scripts/*.sh

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: lite-launcher-apk
          path: app/build/outputs/apk/release/app-release.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Refuse to publish debug-signed APKs: users could never upgrade to a properly signed one.
      - name: Decode signing key
        run: |
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PversionName="$version" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "lite-launcher-$version.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lite-launcher-*.apk --generate-notes
