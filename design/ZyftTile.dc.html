<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;aspect-ratio:16/9;transform:{{ t.tf }};opacity:{{ t.op }};z-index:{{ t.z }};font-family:Roboto, system-ui, sans-serif;transition:transform 120ms ease-out, opacity 120ms ease-out;">
  <div style="position:absolute;inset:0;border-radius:8px;overflow:hidden;background:{{ t.bg }};box-shadow:{{ t.sh }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 12px;box-sizing:border-box;">
    <sc-if value="{{ t.isBanner }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:{{ t.fg }};white-space:nowrap;">{{ t.name }}</div>
    </sc-if>
    <sc-if value="{{ t.isApp }}" hint-placeholder-val="{{ false }}">
      <div style="width:40px;height:40px;border-radius:10px;background:{{ t.ic }};display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:20px;font-weight:700;flex:none;">{{ t.l }}</div>
      <div style="max-width:100%;font-size:15px;font-weight:500;color:#F2F3F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ t.label }}</div>
    </sc-if>
    <sc-if value="{{ t.isUtil }}" hint-placeholder-val="{{ false }}">
      <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;">
        <sc-if value="{{ t.isIn }}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="3" y="5" width="22" height="14" rx="2" fill="none" stroke="#A3A9B4" stroke-width="2"></rect><rect x="10" y="22" width="8" height="2" rx="1" fill="#A3A9B4"></rect></svg></sc-if>
        <sc-if value="{{ t.isSet }}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="9" fill="none" stroke="#A3A9B4" stroke-width="2"></circle><circle cx="14" cy="14" r="3" fill="#A3A9B4"></circle></svg></sc-if>
        <sc-if value="{{ t.isCus }}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="4" y="4" width="9" height="9" rx="2" fill="#A3A9B4"></rect><rect x="15" y="4" width="9" height="9" rx="2" fill="none" stroke="#A3A9B4" stroke-width="2"></rect><rect x="4" y="15" width="9" height="9" rx="2" fill="none" stroke="#A3A9B4" stroke-width="2"></rect><rect x="15" y="15" width="9" height="9" rx="2" fill="#A3A9B4"></rect></svg></sc-if>
      </div>
      <div style="font-size:15px;font-weight:500;color:#F2F3F5;white-space:nowrap;">{{ t.label }}</div>
    </sc-if>
  </div>
  <sc-if value="{{ t.hasBadge }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:10px;background:rgba(11,13,16,0.88);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#F2F3F5;line-height:1;">{{ t.badge }}</div>
  </sc-if>
  <sc-if value="{{ t.showCap }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:calc(100% + 8px);left:-8px;right:-8px;text-align:center;font-size:15px;font-weight:500;color:#F2F3F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ t.capText }}</div>
  </sc-if>
  <sc-if value="{{ t.moving }}" hint-placeholder-val="{{ false }}">
    <svg width="10" height="14" viewBox="0 0 10 14" style="position:absolute;left:-19px;top:calc(50% - 7px);"><polygon points="10,0 10,14 0,7" fill="#C5F36A"></polygon></svg>
    <svg width="10" height="14" viewBox="0 0 10 14" style="position:absolute;right:-19px;top:calc(50% - 7px);"><polygon points="0,0 10,7 0,14" fill="#C5F36A"></polygon></svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:120},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
